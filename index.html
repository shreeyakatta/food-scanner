<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Scanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header>
      <h1>🥔 Food Scanner</h1>
      <p>Scan any packet. Know what's inside. Eat smarter.</p>
    </header>

    <section class="card">
      <h2>📷 Scan a barcode</h2>
      <button id="cameraBtn" class="btn-camera">Start camera</button>
      <div id="reader"></div>
    </section>

    <section class="card">
      <h2>⌨️ Type the barcode</h2>
      <div class="row">
        <input type="text" id="code" placeholder="e.g. 3017620422003">
        <button id="searchBtn" class="btn-search">Search</button>
      </div>
    </section>

    <section class="card">
      <h2>🏷️ Not found? Read the label</h2>
      <input type="file" id="labelPhoto" accept="image/*">
      <button id="labelBtn" class="btn-label">Read label</button>
    </section>

    <section class="card">
      <h2>📋 Result</h2>
      <pre id="out"></pre>
    </section>

  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
